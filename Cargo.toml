[workspace]
members = ["crates/*", "examples/minimal-embed", "examples/admission-receipt", "examples/fenced-abandon", "examples/host-trace", "examples/bounded-snapshot", "examples/native-extension", "examples/wasm-extension", "examples/codex-login", "examples/datadog-export", "examples/operational-telemetry", "xtask"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"
