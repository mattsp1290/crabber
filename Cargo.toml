[workspace]
members = ["crates/*", "examples/minimal-embed", "examples/admission-receipt", "examples/host-trace", "examples/bounded-snapshot", "examples/native-extension", "examples/wasm-extension", "examples/codex-login", "examples/datadog-export", "examples/operational-telemetry", "examples/agui-sse", "xtask"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"

[patch.crates-io]
ag-ui-core = { git = "https://github.com/mattsp1290/ag-ui.git", rev = "5cc34b11fb41c6f068c27410b5756dbebcb367dd" }
