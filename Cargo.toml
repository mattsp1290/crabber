[workspace]
members = ["crates/*", "examples/minimal-embed", "examples/admission-receipt", "examples/fenced-abandon", "examples/host-trace", "examples/bounded-snapshot", "examples/native-extension", "examples/wasm-extension", "examples/codex-login", "examples/datadog-export", "examples/operational-telemetry", "examples/agui-sse", "examples/workspace-context-probe", "examples/server-host-probe", "examples/agents-md-middleware", "xtask"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"

[patch.crates-io]
ag-ui-core = { git = "https://github.com/mattsp1290/ag-ui.git", rev = "705303b26b6b900cdf9bdfa456fbd92a7003ca6b" }

# Cached codecs and validators dominate several CPU-heavy debug contracts.
# Keep dev compilation unoptimized and retain debug/overflow checks.
# The test profile inherits these dev-package overrides.
[profile.dev.package.serde_json]
opt-level = 1

[profile.dev.package.sha2]
opt-level = 1

[profile.dev.package.jsonschema]
opt-level = 1

# A bounded test-only candidate for native and source-embedded owner ledgers.
# Other workspace packages and all normal CLI/dev units retain opt-level 0.
[profile.test.package.crabber-session]
opt-level = 1
debug-assertions = true
overflow-checks = true

[profile.test.package.crabber]
opt-level = 1
debug-assertions = true
overflow-checks = true
