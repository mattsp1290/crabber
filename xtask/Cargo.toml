[package]
name = "xtask"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
proc-macro2 = { version = "1", features = ["span-locations"] }
syn = { version = "2", features = ["full", "visit"] }
toml = "0.8"
sha2 = "0.10"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde_json = "1"
time = { version = "0.3", features = ["formatting"] }

[lints]
workspace = true

[target.'cfg(unix)'.dependencies]
signal-hook = "=0.4.5"
nix = { version = "=0.31.3", features = ["signal", "process"] }

[features]
postgres-check = ["dep:futures-util", "dep:testcontainers-modules", "dep:tokio", "dep:crabber-session", "dep:crabber-test-support", "dep:sqlx"]

[dependencies.testcontainers-modules]
version = "=0.15.0"
features = ["postgres"]
optional = true

[dependencies.tokio]
version = "1"
features = ["rt-multi-thread", "time"]
optional = true

[dependencies.crabber-session]
path = "../crates/crabber-session"
features = ["postgres"]
optional = true

[dependencies.crabber-test-support]
path = "../crates/crabber-test-support"
optional = true

[dependencies.sqlx]
version = "0.8"
default-features = false
features = ["runtime-tokio", "postgres", "tls-rustls"]
optional = true

[dependencies.futures-util]
version = "0.3"
optional = true
