[package]
name = "crabber-agui"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
crabber-core = { path = "../crabber-core" }
ag-ui-core = { git = "https://github.com/mattsp1290/ag-ui.git", rev = "705303b26b6b900cdf9bdfa456fbd92a7003ca6b" }
ag-ui-encoder = { git = "https://github.com/mattsp1290/ag-ui.git", rev = "705303b26b6b900cdf9bdfa456fbd92a7003ca6b" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[lints]
workspace = true

[dev-dependencies]
async-trait = "0.1"
ag-ui-client = { git = "https://github.com/mattsp1290/ag-ui.git", rev = "705303b26b6b900cdf9bdfa456fbd92a7003ca6b" }
crabber = { path = "../crabber" }
crabber-session = { path = "../crabber-session" }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "io-util", "time"] }
time = "0.3"
