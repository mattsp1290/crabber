[package]
name = "crabber-tools-core"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false



[dependencies]
globset = "0.4"
crabber = { path = "../crabber" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time", "process", "io-util", "fs"] }
tokio-util = "0.7"
sha2 = "0.10"
cap-std = "4"
getrandom = "0.3"
rustix = { version = "1", features = ["process", "fs"] }
libc = "0.2"

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
