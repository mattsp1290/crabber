[package]
name = "crabber-session"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
crabber-core = { path = "../crabber-core" }
async-trait = "0.1"
thiserror = "2"
# Canonical records must deserialize to the same finite f64 bits and byte size.
serde_json = { version = "1", features = ["float_roundtrip"] }
sha2 = "0.10"
hmac = { version = "0.12", optional = true }
time = "0.3"
uuid = { version = "1", features = ["v4"] }
serde = "1"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio"], optional = true }

[features]
default = []
postgres = ["dep:sqlx", "sqlx/postgres", "sqlx/tls-rustls", "sqlx/json", "dep:hmac"]
sqlite = ["dep:sqlx", "sqlx/sqlite", "dep:hmac"]

[dev-dependencies]
tempfile = "3"
allocation-counter = "0.8.1"
crabber = { path = "../crabber" }
tokio = { version = "1", features = ["macros", "rt", "sync", "time"] }

[lints]
workspace = true
