[package]
name = "crabber-session"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
crabber-core = { path = "../crabber-core" }
async-trait = "0.1"
serde_json = "1"
sha2 = "0.10"
time = "0.3"
uuid = { version = "1", features = ["v4"] }
serde = "1"
sqlx = { version = "0.8", default-features = false, features = ["postgres", "runtime-tokio", "tls-rustls", "json"], optional = true }

[features]
default = []
postgres = ["dep:sqlx"]

[dev-dependencies]
crabber = { path = "../crabber" }
tokio = { version = "1", features = ["macros", "rt", "sync", "time"] }

[lints]
workspace = true
