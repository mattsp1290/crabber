[package]
name = "crabber-obs"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
otlp = ["dep:opentelemetry", "dep:opentelemetry_sdk", "dep:opentelemetry-otlp", "dep:tracing-opentelemetry"]

[dependencies]
tracing-subscriber = { version = "0.3", default-features = false, features = ["registry", "std"] }
opentelemetry = { version = "0.33", optional = true }
opentelemetry_sdk = { version = "0.33", default-features = false, features = ["trace"], optional = true }
opentelemetry-otlp = { version = "0.33", default-features = false, features = ["trace", "http-proto", "http-json", "reqwest-blocking-client"], optional = true }
tracing-opentelemetry = { version = "0.34", default-features = false, optional = true }
crabber-core = { path = "../crabber-core" }
crabber-runtime = { path = "../crabber-runtime" }
flate2 = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["rt", "sync", "time"] }
tracing = "0.1"
time = "0.3"

[dev-dependencies]
tracing-subscriber = { version = "0.3", features = ["registry"] }
opentelemetry-proto = { version = "0.33", default-features = false, features = ["gen-tonic-messages", "trace"] }
prost = "0.14"
crabber-extension = { path = "../crabber-extension" }
crabber-providers = { path = "../crabber-providers" }
crabber-session = { path = "../crabber-session" }
async-trait = "0.1"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "time", "net", "test-util"] }

[lints]
workspace = true
