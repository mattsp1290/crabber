[package]
name = "crabber-providers"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
tracing = "0.1"
crabber-core = { path = "../crabber-core" }
crabber-auth = { path = "../crabber-auth", optional = true }
async-trait = "0.1"
bytes = { version = "1", optional = true }
futures = "0.3"
reqwest = { version = "0.12", features = ["json", "stream", "rustls-tls"], default-features = false, optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"

[features]
default = []
custom-http = ["dep:reqwest", "dep:bytes"]
anthropic = ["dep:reqwest", "dep:bytes"]
openai = ["dep:reqwest", "dep:bytes"]
codex = ["dep:reqwest", "dep:bytes", "dep:crabber-auth"]
opencode-go = ["dep:reqwest", "dep:bytes"]
all-providers = ["anthropic", "openai", "codex", "opencode-go"]

[dev-dependencies]
tracing-subscriber = { version = "0.3", features = ["registry"] }
tokio = { version = "1", features = ["io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }

[[test]]
name = "custom_http"
required-features = ["custom-http"]

[lints]
workspace = true
