[package]
name = "crabber-providers"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
crabber-core = { path = "../crabber-core" }
crabber-auth = { path = "../crabber-auth", optional = true }
async-trait = "0.1"
bytes = { version = "1", optional = true }
futures = "0.3"
reqwest = { version = "0.12", features = ["json", "stream", "rustls-tls"], default-features = false, optional = true }
serde_json = "1"
thiserror = "2"

[features]
default = []
anthropic = ["dep:reqwest", "dep:bytes"]
openai = ["dep:reqwest", "dep:bytes"]
codex = ["dep:reqwest", "dep:bytes", "dep:crabber-auth"]
opencode-go = ["dep:reqwest", "dep:bytes"]
all-providers = ["anthropic", "openai", "codex", "opencode-go"]

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true
