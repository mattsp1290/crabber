[package]
name = "crabber-tools-applypatch"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
all = "warn"

[dependencies]
crabber = { path = "../crabber" }
crabber-tools-core = { path = "../crabber-tools-core" }
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio-util = "0.7"
cap-std = "4"
libc = "0.2"

[dev-dependencies]
crabber-tools-testkit = { path = "../crabber-tools-testkit" }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time", "process", "io-util", "fs"] }
tempfile = "3"
