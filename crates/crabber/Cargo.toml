[package]
name = "crabber"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
crabber-core = { path = "../crabber-core" }
crabber-auth = { path = "../crabber-auth", optional = true }
crabber-extension = { path = "../crabber-extension" }
crabber-providers = { path = "../crabber-providers" }
crabber-runtime = { path = "../crabber-runtime" }
crabber-obs = { path = "../crabber-obs", optional = true }
crabber-session = { path = "../crabber-session" }
crabber-wasm = { path = "../crabber-wasm", optional = true }
tokio = { version = "1", features = ["sync"] }
thiserror = "2"
async-trait = "0.1"
serde_json = "1"

[dev-dependencies]
url = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["registry"] }
opentelemetry-proto = { version = "0.33", default-features = false, features = ["gen-tonic-messages", "trace"] }
prost = "0.14"
jsonschema = { version = "0.58", default-features = false }
futures = "0.3"
crabber-agui = { path = "../crabber-agui" }
flate2 = "1"
allocation-counter = "0.8.1"
uuid = { version = "1", features = ["v4"] }
time = "0.3"
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread", "time", "process", "io-util", "test-util", "net"] }
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio-rustls", "postgres", "sqlite"] }
tempfile = "3"

[lints]
workspace = true

[features]
default = []
postgres = ["crabber-session/postgres"]
sqlite = ["crabber-session/sqlite", "crabber-runtime/sqlite"]
custom-http = ["crabber-providers/custom-http"]
anthropic = ["crabber-providers/anthropic"]
openai = ["crabber-providers/openai"]
codex = ["crabber-providers/codex", "dep:crabber-auth"]
opencode-go = ["crabber-providers/opencode-go"]
all-providers = ["crabber-providers/all-providers"]

datadog = ["dep:crabber-obs"]
otlp = ["datadog", "crabber-obs/otlp"]
wasm = ["dep:crabber-wasm"]
