[package]
name = "crabber"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
crabber-core = { path = "../crabber-core" }
crabber-extension = { path = "../crabber-extension" }
crabber-providers = { path = "../crabber-providers" }
crabber-runtime = { path = "../crabber-runtime" }
crabber-session = { path = "../crabber-session" }
tokio = { version = "1", features = ["sync"] }
thiserror = "2"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt", "time"] }

[lints]
workspace = true
