[package]
name = "crabber-extensions"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
crabber = { path = "../crabber" }
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["macros", "rt", "sync", "time", "process", "io-util"] }
tokio-util = "0.7"
cap-std = "4"
cap-fs-ext = "4"
regex = "1"
regex-syntax = "0.8"
url = "2"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
rustix = { version = "1", features = ["process"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "test-util", "sync", "time", "process", "io-util"] }
tempfile = "3"
jsonschema = { version = "0.58", default-features = false }

[lints.rust]
unsafe_code = "forbid"
[lints.clippy]
all = "warn"

[features]
live-opencode-go = ["crabber/opencode-go"]

[[test]]
name = "delegate_task_live"
required-features = ["live-opencode-go"]
