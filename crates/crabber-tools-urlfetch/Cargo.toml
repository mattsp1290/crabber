[package]
name = "crabber-tools-urlfetch"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false


[dependencies]
crabber = { path = "../crabber" }
crabber-tools-core = { path = "../crabber-tools-core" }
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time", "process", "io-util", "fs", "net"] }
tokio-util = "0.7"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-native-roots"] }
url = "2"
cap-std = "4"
libc = "0.2"
[dev-dependencies]
crabber-tools-testkit = { path = "../crabber-tools-testkit" }
tempfile = "3"
tokio = { version = "1", features = ["test-util"] }

[lints]
workspace = true
