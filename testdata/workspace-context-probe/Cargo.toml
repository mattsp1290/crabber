[package]
name = "workspace-context-pinned-probe"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
async-trait = "0.1"
crabber = { git = "ssh://git@github.com/mattsp1290/crabber.git", rev = "04e31b1cf7110f44fe1bbc73668111884f291508" }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "sync"] }

[features]
default = []
postgres = ["crabber/postgres"]

[dev-dependencies]
time = "0.3"
