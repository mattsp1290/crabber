[package]
name = "crabber-tools-consumer-probe"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
crabber = { git = "ssh://git@github.com/mattsp1290/crabber.git", rev = "3ff793c982aa1fc31e5d3a2bbe459f753d7bbf8e", features = ["sqlite"] }
crabber-tools-catalog = { git = "ssh://git@github.com/mattsp1290/crabber-tools.git", rev = "CRABBER_TOOLS_REV" }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
serde_json = "1"
async-trait = "0.1"
tempfile = "3"
