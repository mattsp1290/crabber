[package]
name = "external-host"
version = "0.1.0"
edition = "2024"

[dependencies]
crabber-agui = { path = "../../../crates/crabber-agui" }
crabber = { path = "../../../crates/crabber", features = ["wasm", "datadog"] }
sha2 = "0.10"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "io-util", "time", "test-util"] }
serde_json = { version = "1", features = ["preserve_order"] }
async-trait = "0.1"
flate2 = "1"
futures = "0.3"
time = "0.3"

[features]
default = ["datadog"]
datadog = ["crabber/datadog"]
