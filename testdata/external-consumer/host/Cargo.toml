[package]
name = "external-host"
version = "0.1.0"
edition = "2024"

[dependencies]
crabber = { path = "../../../crates/crabber", features = ["wasm", "datadog"] }
sha2 = "0.10"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
serde_json = { version = "1", features = ["preserve_order"] }
async-trait = "0.1"
flate2 = "1"

[features]
default = ["datadog"]
datadog = ["crabber/datadog"]
