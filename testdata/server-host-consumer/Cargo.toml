[package]
name = "server-host-consumer"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
crabber = { path = "../../crates/crabber" }
server-host-probe = { path = "../../examples/server-host-probe" }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
serde_json = "1"

[features]
default = []
postgres = ["crabber/postgres", "server-host-probe/postgres"]
sqlite = ["crabber/sqlite", "server-host-probe/sqlite"]
