name: Diagnostic current493 library quarter

on:
  pull_request:
    branches: [feat/ten-minute-tests]
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  actions: read

defaults:
  run:
    shell: bash

env:
  CARGO_TARGET_DIR: ${{ github.workspace }}/target
  CARGO_BUILD_JOBS: "4"
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  CRABBER_POSTGRES_IMAGE: postgres:14@sha256:c2427de38f998489d36de7ca3553db2134872c400f2b08be4b824e5c50e4d619
  PILOT_BASE_SHA: ${{ github.event.pull_request.base.sha }}

jobs:
  library-quarter:
    if: github.event.pull_request.draft && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'diagnostics/library-quarter-current493'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install required ripgrep
        run: |
          sudo apt-get update && sudo apt-get install -y ripgrep
          major=$(rg --version | head -1 | cut -d' ' -f2 | cut -d. -f1)
          test "$major" -ge 14
      - name: Provision pinned Rust
        run: |
          rust_version="$(python3 -I -S -c 'import json; print(json.load(open(".config/test-tools.json"))["rust"]["version"])')"
          rustup toolchain install "$rust_version" --profile minimal --component rustfmt --component clippy
          rustup target add --toolchain "$rust_version" wasm32-wasip2
          test "$(rustc -Vv | sha256sum | cut -d ' ' -f 1)" = b569b0c98ea3133c7252b4b8ea6b39b7b353813df0dd5f5c412c355691424112
      - name: Download exact successful normal493 evidence without compilation
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -I -S -B .github/scripts/library-quarter-baseline.py download
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: cache
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/debug
            target/release
            target/wasm32-wasip2
            target/local-probes
            target/consumer-probes
            target/test-tools
            fixtures/wasm/target
          key: rust-Linux-X64-b569b0c98ea3133c7252b4b8ea6b39b7b353813df0dd5f5c412c355691424112-dev0-test0-inc0-combined-v1-2140fed529d2fc7a4b7788fa8a0ae04e871570c1df6d03fa97d46e9e82ac09e0-49317956a606826999161c8ae283c5c1f5fce19f-40164010460-1
          fail-on-cache-miss: true
      - name: Verify exact cache and current493 baseline without compilation
        env:
          GH_TOKEN: ${{ github.token }}
          RESTORED_KEY: ${{ steps.cache.outputs.cache-matched-key }}
          CACHE_EXACT_HIT: ${{ steps.cache.outputs.cache-hit }}
        run: |
          python3 -I -S -B .github/scripts/cache-source-times.py restore
          python3 -I -S -B .github/scripts/library-quarter-baseline.py prepare
          echo "$GITHUB_WORKSPACE/target/test-tools" >> "$GITHUB_PATH"
          echo "$GITHUB_WORKSPACE/target/test-tools/bin" >> "$GITHUB_PATH"
      - name: Verify cached pinned tools and PostgreSQL image
        run: |
          python3 -I -S - <<'PY'
          import json, subprocess
          pins = json.load(open('.config/test-tools.json'))
          version = subprocess.check_output(['cargo-nextest', 'nextest', '--version'], text=True).split()
          assert version[:2] == ['cargo-nextest', pins['nextest']['version']]
          print('Pinned nextest version verified:', version[1])
          PY
          wasm_version="$(python3 -I -S -c 'import json; print(json.load(open(".config/test-tools.json"))["wasm-tools"]["version"])')"
          test "$(wasm-tools --version)" = "wasm-tools $wasm_version"
          test -f target/test-tools/postgres-14.tar
          docker load -i target/test-tools/postgres-14.tar
          docker pull "$CRABBER_POSTGRES_IMAGE"
      - name: Start after-setup clock
        id: budget
        run: echo "start=$(date +%s.%N)" >> "$GITHUB_OUTPUT"
      - name: Invalidate Session, compile all libraries and execute exact first quarter
        env:
          CHECK_STARTED: ${{ steps.budget.outputs.start }}
        run: |
          mkdir -p target/test-performance/library-quarter-logs
          python3 -I -S -B .github/scripts/library-quarter-pilot.py launch 2>&1 | tee target/test-performance/library-quarter-logs/raw.log
      - name: Preserve diagnostic evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: diagnostic-current493-quarter-X64-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            target/test-performance/cache-restore.json
            target/test-performance/library-quarter-baseline.json
            target/test-performance/library-quarter-baseline/download.json
            target/test-performance/library-quarter-logs/raw.log
            target/test-performance/library-quarter-${{ github.run_id }}/**/*
          if-no-files-found: ignore
          retention-days: 7
