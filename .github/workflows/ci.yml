name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  CARGO_TARGET_DIR: ${{ github.workspace }}/target
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install stable Rust with rustfmt and Clippy
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy
          rustup default stable
          rustup target add wasm32-wasip2
      - name: Record compiler cache identity
        id: compiler
        run: echo "hash=$(rustc -Vv | sha256sum | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/debug
            target/release
            target/wasm32-wasip2
            target/local-probes
            target/consumer-probes
            target/test-tools
            fixtures/wasm/target
            testdata/external-consumer/target
            testdata/server-host-consumer/target
            testdata/custom-http-feature-probe/target
          key: rust-${{ runner.os }}-${{ runner.arch }}-${{ steps.compiler.outputs.hash }}-dev0-test0-inc0-offline-${{ hashFiles('Cargo.lock', 'fixtures/wasm/Cargo.lock', 'fixtures/wasm-negative/Cargo.lock', 'testdata/*/Cargo.lock', 'rust-toolchain.toml', '.config/test-tools.json', '.config/nextest.toml') }}
          restore-keys: rust-${{ runner.os }}-${{ runner.arch }}-${{ steps.compiler.outputs.hash }}-dev0-test0-inc0-offline-
      - name: Install pinned test tools
        run: |
          python3 -I -S .github/scripts/install-nextest.py target/test-tools
          if ! test -x target/test-tools/bin/wasm-tools || test "$(target/test-tools/bin/wasm-tools --version)" != "wasm-tools 1.261.0"; then
            cargo install wasm-tools --version 1.261.0 --locked --root target/test-tools --force
          fi
          echo "$GITHUB_WORKSPACE/target/test-tools" >> "$GITHUB_PATH"
          echo "$GITHUB_WORKSPACE/target/test-tools/bin" >> "$GITHUB_PATH"
      - name: Refresh compiled source provenance after cache restore
        run: cargo clean -p minimal-embed -p fenced-abandon -p operational-telemetry
      - name: Check offline workspace
        run: cargo xtask check --timings "target/test-performance/ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}/offline.json"
      - name: Preserve sanitized offline timing report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-performance-offline-${{ github.run_id }}-${{ github.run_attempt }}
          path: target/test-performance/ci-${{ github.run_id }}-${{ github.run_attempt }}/offline.json
          if-no-files-found: ignore
          retention-days: 7

  postgres:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install stable Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - name: Record compiler cache identity
        id: compiler
        run: echo "hash=$(rustc -Vv | sha256sum | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/debug
            target/release
            target/wasm32-wasip2
            target/local-probes
            target/consumer-probes
            target/test-tools
          key: rust-${{ runner.os }}-${{ runner.arch }}-${{ steps.compiler.outputs.hash }}-dev0-test0-inc0-postgres-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml', '.config/test-tools.json', '.config/nextest.toml') }}
          restore-keys: rust-${{ runner.os }}-${{ runner.arch }}-${{ steps.compiler.outputs.hash }}-dev0-test0-inc0-postgres-
      - name: Install pinned test runner
        run: |
          python3 -I -S .github/scripts/install-nextest.py target/test-tools
          echo "$GITHUB_WORKSPACE/target/test-tools" >> "$GITHUB_PATH"
      - name: Refresh compiled source provenance after cache restore
        run: cargo clean -p fenced-abandon
      - name: Required PostgreSQL contracts and actual demos
        run: cargo run -p xtask --features postgres-check -- check-postgres --runner nextest --fixture-metrics "target/test-performance/ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}/postgres.jsonl"
      - name: Preserve sanitized PostgreSQL fixture report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-performance-postgres-${{ github.run_id }}-${{ github.run_attempt }}
          path: target/test-performance/ci-${{ github.run_id }}-${{ github.run_attempt }}/postgres.jsonl
          if-no-files-found: ignore
          retention-days: 7
