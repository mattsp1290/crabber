name: DIAGNOSTIC ONLY - quality contracts - NEVER MERGE

on:
  pull_request:
    branches: [feat/quality-contracts-part]
    types: [opened, synchronize, reopened, converted_to_draft]

permissions:
  contents: read
  actions: read

defaults:
  run:
    shell: bash

env:
  CARGO_TARGET_DIR: ${{ github.workspace }}/target
  CARGO_BUILD_JOBS: "4"
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  CRABBER_REQUIRE_POSTGRES: "1"
  BACKGROUND_JOBS_REQUIRE_SHELL: "1"
  PYTHON_REPL_REQUIRE_PYTHON: "1"
  CRABBER_TOOLS_REQUIRE_LOGIN_PROFILE: "1"

jobs:
  quality-contracts-cost:
    if: >-
      github.repository == 'mattsp1290/crabber' &&
      github.event.pull_request.draft == true &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'diagnostics/quality-contracts-f0' &&
      github.base_ref == 'feat/quality-contracts-part' &&
      github.event.pull_request.base.sha == 'f0cfc61dfec018c24be0124ad6f80856f50be47e'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Refuse a missing exact f0 push cache and bind its normal artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -I -S .github/scripts/quality-contracts-probe.py baseline
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install required ripgrep and pinned Rust prerequisites
        run: |
          sudo apt-get update && sudo apt-get install -y ripgrep
          major=$(rg --version | head -1 | cut -d' ' -f2 | cut -d. -f1)
          test "$major" -ge 14
          version="$(python3 -I -S -c 'import json; print(json.load(open(".config/test-tools.json"))["rust"]["version"])')"
          rustup toolchain install "$version" --profile minimal --component rustfmt --component clippy
          rustup target add --toolchain "$version" wasm32-wasip2
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        id: cache
        with:
          fail-on-cache-miss: true
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/debug
            target/release
            target/wasm32-wasip2
            target/local-probes
            target/consumer-probes
            target/test-tools
            fixtures/wasm/target
          key: rust-Linux-X64-b569b0c98ea3133c7252b4b8ea6b39b7b353813df0dd5f5c412c355691424112-dev0-test0-inc0-combined-v1-24bb56e0cd76db97a185336083fb00d1aebb3dc7e37318c01cb175e8f820acc9-f0cfc61dfec018c24be0124ad6f80856f50be47e-40182665064-1
      - name: Verify restored provenance and restore source timestamps without building
        env:
          RESTORED_KEY: ${{ steps.cache.outputs.cache-matched-key }}
          CACHE_EXACT_HIT: ${{ steps.cache.outputs.cache-hit }}
        run: |
          python3 -I -S .github/scripts/quality-contracts-probe.py restored
          python3 -I -S .github/scripts/cache-source-times.py restore
          echo "$GITHUB_WORKSPACE/target/test-tools" >> "$GITHUB_PATH"
          echo "$GITHUB_WORKSPACE/target/test-tools/bin" >> "$GITHUB_PATH"
      - name: Start after-setup clock
        id: clock
        run: echo "start=$(date +%s.%N)" >> "$GITHUB_OUTPUT"
      - name: Measure actual contracts with compilation and terminal cleanup
        env:
          CHECK_STARTED: ${{ steps.clock.outputs.start }}
        run: python3 -I -S .github/scripts/quality-contracts-probe.py run
      - name: Preserve diagnostic evidence without saving a compiler cache
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: DIAGNOSTIC-quality-contracts-X64-${{ github.run_id }}-${{ github.run_attempt }}
          path: target/test-performance/quality-contracts-probe
          if-no-files-found: warn
