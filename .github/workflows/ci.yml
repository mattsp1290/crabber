name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install stable Rust with rustfmt and Clippy
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy
          rustup default stable
      - name: Install WASM tooling
        run: |
          rustup target add wasm32-wasip2
          cargo install wasm-tools --locked
      - name: Check workspace
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/target
          CARGO_INCREMENTAL: "0"
          CARGO_PROFILE_DEV_DEBUG: "0"
          CARGO_PROFILE_TEST_DEBUG: "0"
        run: cargo xtask check

  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:14
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      CRABBER_TEST_POSTGRES_URL: postgres://postgres@localhost:5432/postgres
      CRABBER_REQUIRE_POSTGRES: "1"
      CRABBER_POSTGRES_URL: postgres://postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - name: Install stable Rust
        run: rustup toolchain install stable --profile minimal && rustup default stable
      - name: PostgreSQL contracts, concurrency, migration and process durability
        run: cargo test -p crabber-session --features postgres
      - name: Public facade response-loss and fresh-process reconciliation
        run: cargo test -p crabber --features postgres --test admission_receipts -- --nocapture
      - name: Noninteractive PostgreSQL admission demo
        run: cargo run --quiet -p admission-receipt --features postgres -- --postgres
      - name: Public fenced abandonment atomic rollback and process crash
        run: cargo test -p crabber --features postgres --test fenced_abandon -- --nocapture
      - name: Noninteractive PostgreSQL fenced abandonment demo
        run: cargo run --quiet -p fenced-abandon --features postgres -- --postgres
