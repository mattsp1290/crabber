name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      native-diagnostic:
        description: Opt-in Native-only diagnostic
        type: choice
        options: ['off', x64, arm64, both]
        default: 'off'
      native-compiler-cache:
        description: Optional Native worker compiler cache restoration
        type: choice
        options: ['off', restore-compatible]
        default: 'off'
      quality-diagnostic:
        description: Opt-in independent quality part measurements on x64
        type: choice
        options: ['off', quality-contracts, quality-artifacts, both]
        default: 'off'
      qualify:
        description: Run the three cached-source qualification cases once
        type: boolean
        default: false

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  CARGO_TARGET_DIR: ${{ github.workspace }}/target
  CARGO_BUILD_JOBS: "4"
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  CRABBER_POSTGRES_IMAGE: postgres:14@sha256:c2427de38f998489d36de7ca3553db2134872c400f2b08be4b824e5c50e4d619

jobs:
  check:
    if: ${{ !(github.event_name == 'workflow_dispatch' && (inputs.native-diagnostic != 'off' || inputs.quality-diagnostic != 'off') && (inputs.qualify || vars.CRABBER_QUALIFY_REVISION == github.sha)) }}
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    env:
      CARGO_PROFILE_DEV_STRIP: "symbols"
      CARGO_PROFILE_TEST_STRIP: "symbols"
    # Bootstrap correctness runs report the 600s target separately.
    # Qualification still enforces 600s for each of its three cases.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up required check
        id: check-setup
        uses: ./.github/actions/check-setup
      - name: Start complete-check clock after setup
        id: budget
        env:
          SETUP_STARTED: ${{ steps.check-setup.outputs.setup-start }}
        run: |
          python3 -I -S - <<'PY'
          import json, os, pathlib, time
          started = time.time()
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              print(f'start={started}', file=output)
          path = pathlib.Path('target/test-performance/cache-restore.json')
          report = json.loads(path.read_text())
          report['setup_seconds_before_check'] = started - float(os.environ['SETUP_STARTED'])
          report['check_timing_scope'] = 'after setup, including compilation and cleanup'
          path.write_text(json.dumps(report, indent=2) + '\n')
          PY
      - name: Complete required check including compilation and cleanup
        if: ${{ !((github.event_name == 'workflow_dispatch' && inputs.qualify) || vars.CRABBER_QUALIFY_REVISION == github.sha) }}
        env:
          CHECK_STARTED: ${{ steps.budget.outputs.start }}
          CACHE_STATE: ${{ steps.check-setup.outputs.cache-state }}
        run: python3 -I -S .github/scripts/check.py --budget-seconds 4800 --ci-start-time "$CHECK_STARTED" --cache-state "$CACHE_STATE" --report "target/test-performance/ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}/check.json"
      - name: Qualify no-op and affected workspace rebuilds
        if: ${{ (github.event_name == 'workflow_dispatch' && inputs.qualify) || vars.CRABBER_QUALIFY_REVISION == github.sha }}
        env:
          CHECK_STARTED: ${{ steps.budget.outputs.start }}
        run: python3 -I -S .github/scripts/qualify-check.py --warm-report target/test-performance/cache-restore.json --ci-start-time "$CHECK_STARTED" --output "target/test-performance/ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}/qualification"
      - name: Mark complete cache snapshot
        if: success()
        run: |
          python3 -I -S - <<'PY'
          import json, os, pathlib
          directory = pathlib.Path('target/test-performance') / ('ci-' + os.environ['GITHUB_RUN_ID'] + '-' + os.environ['GITHUB_RUN_ATTEMPT'])
          report = directory / 'check.json'
          if not report.exists():
              report = directory / 'qualification/session-rebuild.json'
          result = json.loads(report.read_text())
          pathlib.Path('target/test-tools/complete-cache.json').write_text(json.dumps({'revision': os.environ['GITHUB_SHA'], 'complete': True, 'check': result}) + '\n')
          PY
      - name: Prune obsolete native test executables as CI maintenance
        if: always() && steps.check-setup.outputs.cache-outcome == 'success'
        # Run only after the complete check or whole qualification protocol.
        # Partial builds may prune only equivalent variants of completed units;
        # absent or ambiguous current artifact evidence retains their cache.
        run: |
          directory="target/test-performance/ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          mkdir -p "$directory"
          python3 -I -S .github/scripts/prune-test-cache.py --run-directory "$directory" --apply | tee "$directory/native-cache-prune.json"
      - name: Prune artifacts that must rebuild after every restore
        if: always() && steps.check-setup.outputs.cache-outcome == 'success'
        # Keep the restore-side clean: old snapshots still contain these files.
        # Their required provenance rebuilds remain inside the measured check.
        run: cargo clean -p minimal-embed -p fenced-abandon -p operational-telemetry
      - name: Preserve unchanged source freshness as CI maintenance
        if: always() && steps.check-setup.outputs.cache-outcome == 'success'
        run: python3 -I -S .github/scripts/cache-source-times.py capture
      - name: Save dependency and compiler snapshot as CI maintenance
        if: always() && steps.check-setup.outputs.cache-outcome == 'success' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/debug
            target/release
            target/wasm32-wasip2
            target/local-probes
            target/consumer-probes
            target/test-tools
            fixtures/wasm/target
          key: ${{ steps.check-setup.outputs.cache-primary-key }}
      - name: Preserve sanitized check, coverage and fixture reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: complete-check-${{ runner.arch }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            target/test-performance/cache-restore.json
            target/test-performance/ci-*/**/*.json
            target/test-performance/complete-*/fixtures.jsonl
            target/test-performance/complete-*/tests.json
            target/test-performance/complete-*/binaries.json
            target/test-performance/complete-*/cargo-metadata.json
            target/test-performance/complete-*/native-artifacts.jsonl
            target/test-performance/complete-*/boundary-features.json
            target/test-performance/complete-*/resource-groups.json
            target/test-performance/complete-*/*-version.txt
          if-no-files-found: ignore
          retention-days: 7

  aarch64-gnu:
    runs-on: ubuntu-24.04-arm
    env:
      BACKGROUND_JOBS_REQUIRE_SHELL: "1"
      PYTHON_REPL_REQUIRE_PYTHON: "1"
      CRABBER_TOOLS_REQUIRE_LOGIN_PROFILE: "1"
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install ripgrep for standard tools
        run: |
          sudo apt-get update && sudo apt-get install -y ripgrep
          major=$(rg --version | head -1 | cut -d' ' -f2 | cut -d. -f1)
          test "$major" -ge 14
      - name: Install stable Rust with rustfmt and Clippy
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy
          rustup default stable
      - name: Install WASM tooling
        run: |
          rustup target add wasm32-wasip2
          cargo install wasm-tools --locked
      - name: Verify native arm64 GNU toolchain
        run: |
          rustc -vV | grep 'host: aarch64-unknown-linux-gnu'
      - name: Build architecture-independent WASM fixtures
        run: cargo xtask build-fixtures
      - name: Build workspace and all targets
        run: cargo build --workspace --all-targets
      - name: Test workspace
        run: cargo test --workspace
      - name: Run credential-free embedding smoke test
        run: cargo run --quiet -p minimal-embed
      - name: Run standard tools mounting smoke test
        run: cargo run --quiet -p mount-standard -- --check

  aarch64-musl:
    runs-on: ubuntu-24.04-arm
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      CC_aarch64_unknown_linux_musl: musl-gcc
      CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
    steps:
      - uses: actions/checkout@v4
      - name: Install stable Rust and musl target
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add aarch64-unknown-linux-musl
      - name: Install native musl toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools ripgrep
          major=$(rg --version | head -1 | cut -d' ' -f2 | cut -d. -f1)
          test "$major" -ge 14
      - name: Build musl workspace without native TLS example
        run: cargo build --workspace --exclude agui-sse --target aarch64-unknown-linux-musl
      - name: Test standard tools as native arm64 musl binaries
        shell: bash
        run: |
          cargo test -p crabber-tools-catalog -p crabber-tools-fileops -p crabber-tools-glob -p crabber-tools-search --target aarch64-unknown-linux-musl 2>&1 | tee musl-tests.log
          grep -E '^test result: ok\. [1-9][0-9]* passed' musl-tests.log
      - name: Run static standard tools mounting smoke test
        run: cargo run -p mount-standard --target aarch64-unknown-linux-musl -- --check
      - name: Verify static linking of embedding and tools binaries
        shell: bash
        run: |
          for binary in minimal-embed mount-standard; do
            file "target/aarch64-unknown-linux-musl/debug/$binary" | grep -E 'statically linked|static-pie linked'
          done

  extensions-python-311:
    runs-on: ubuntu-latest
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      PYTHON_REPL_REQUIRE_PYTHON: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Install stable Rust
        run: rustup toolchain install stable --profile minimal && rustup default stable
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Test native Python REPL with the oldest supported Python
        run: cargo test -p crabber-extensions --test python_repl

  consumer-probe:
    if: github.event_name == 'push'
    needs: check
    runs-on: ubuntu-latest
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      CARGO_TARGET_DIR: ${{ github.workspace }}/target/consumer
    steps:
      - uses: actions/checkout@v4
      - name: Install stable Rust
        run: rustup toolchain install stable --profile minimal && rustup default stable
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install ripgrep
        run: |
          sudo apt-get update && sudo apt-get install -y ripgrep
          major=$(rg --version | head -1 | cut -d' ' -f2 | cut -d. -f1)
          test "$major" -ge 14
      - name: Fetch the public Crabber source over HTTPS
        run: git config --global url.https://github.com/mattsp1290/crabber.git.insteadOf ssh://git@github.com/mattsp1290/crabber.git
      - name: Qualify the runtime, tools, and native extensions at one revision
        env:
          CRABBER_REV: ${{ github.sha }}
        run: ./testdata/standard-tools-consumer/check.sh
      - name: Qualify native extension host and restart journeys
        env:
          CRABBER_REV: ${{ github.sha }}
        run: ./testdata/extensions-consumer/run.sh


  quality-worker:
    name: Quality worker (${{ matrix.part }})
    if: github.event_name == 'workflow_dispatch' && inputs.quality-diagnostic != 'off'
    strategy:
      fail-fast: false
      matrix:
        part: ${{ fromJSON('{"off":[],"quality-contracts":["quality-contracts"],"quality-artifacts":["quality-artifacts"],"both":["quality-contracts","quality-artifacts"]}')[inputs.quality-diagnostic] }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      CARGO_PROFILE_DEV_STRIP: "symbols"
      CARGO_PROFILE_TEST_STRIP: "symbols"
    steps:
      - name: Validate selection and reject qualification conflicts before checkout
        env:
          QUALITY_SELECTION: ${{ inputs.quality-diagnostic }}
          QUALITY_PART: ${{ matrix.part }}
          QUALIFY: ${{ inputs.qualify }}
          QUALIFICATION_REVISION: ${{ vars.CRABBER_QUALIFY_REVISION }}
        run: |
          case "$QUALITY_SELECTION:$QUALITY_PART" in
            quality-contracts:quality-contracts|quality-artifacts:quality-artifacts|both:quality-contracts|both:quality-artifacts) ;;
            *) echo 'Invalid quality diagnostic selection' >&2; exit 1 ;;
          esac
          if test "$QUALIFY" = true || test "$QUALIFICATION_REVISION" = "$GITHUB_SHA"; then
            echo 'Quality diagnostics cannot run with qualification' >&2
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up quality measurement with compatible compiler restoration
        id: quality-setup
        uses: ./.github/actions/check-setup
        with:
          tools: check
          restore-compiler-cache: "true"
          record-cache-use: "true"
      - name: Start quality check clock after setup
        id: quality-budget
        env:
          SETUP_STARTED: ${{ steps.quality-setup.outputs.setup-start }}
        run: |
          python3 -I -S - <<'PY'
          import json, os, pathlib, time
          started = time.time()
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              print(f'start={started}', file=output)
          directory = pathlib.Path('target/quality-worker')
          directory.mkdir(parents=True, exist_ok=True)
          report = {
              'setup_seconds_before_check': started - float(os.environ['SETUP_STARTED']),
              'setup_timing_scope': 'shared pre-cache-restoration clock to check start; excludes Python, ripgrep, Rust provisioning and compiler identity',
              'check_timing_scope': 'after setup, including compilation and cleanup',
          }
          (directory / 'setup.json').write_text(json.dumps(report, indent=2) + '\n')
          PY
      - name: Measure selected quality part including compilation and cleanup
        id: quality-check
        env:
          QUALITY_PART: ${{ matrix.part }}
          CHECK_STARTED: ${{ steps.quality-budget.outputs.start }}
        run: python3 -I -S .github/scripts/check.py --part "$QUALITY_PART" --budget-seconds 4800 --ci-start-time "$CHECK_STARTED" --cache-state unclassified --report target/quality-worker/check.json
      - name: Preserve bounded quality evidence even after check failure
        if: always() && contains(fromJSON('["success","failure","cancelled"]'), steps.quality-check.outcome)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: quality-worker-${{ github.sha }}-X64-${{ matrix.part }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            target/quality-worker/*.json
            target/test-performance/cache-restore.json
            target/test-performance/cache-use/receipt.json
            target/test-performance/complete-*/fixtures.jsonl
            target/test-performance/complete-*/tests.json
            target/test-performance/complete-*/binaries.json
            target/test-performance/complete-*/cargo-metadata.json
            target/test-performance/complete-*/boundary-features.json
            target/test-performance/complete-*/resource-groups.json
            target/test-performance/complete-*/*-version.txt
            target/test-performance/complete-*/normal-output-artifacts.jsonl
            target/test-performance/complete-*/normal-example-artifacts.jsonl
            target/test-performance/complete-*/prepared-normal-examples.json
            target/test-performance/complete-*/normal-outputs.json
            target/local-probes/*/owners.json
            target/local-probes/*/*/compiler.json
            target/local-probes/*/*/source/Cargo.toml
            target/local-probes/*/*/source/Cargo.lock
            target/local-probes/*/shared-target/CACHEDIR.TAG
          if-no-files-found: error
          retention-days: 7
      - name: Record measurement scope
        if: always() && contains(fromJSON('["success","failure","cancelled"]'), steps.quality-check.outcome)
        env:
          QUALITY_PART: ${{ matrix.part }}
          CHECK_OUTCOME: ${{ steps.quality-check.outcome }}
        run: |
          {
            echo "Quality part: $QUALITY_PART (x64)"
            echo "Check outcome: $CHECK_OUTCOME"
            echo 'Measurement only; complete_suite_qualified=false; full_check_executed=false.'
            echo 'The check clock includes compilation and owned cleanup; setup is reported separately.'
            echo 'Native observations have a separate clock and do not include this job.'
          } >> "$GITHUB_STEP_SUMMARY"

  native-plan:
    if: github.event_name == 'workflow_dispatch' && inputs.native-diagnostic != 'off'
    runs-on: ubuntu-latest
    outputs:
      workers: ${{ steps.plan.outputs.workers }}
      collectors: ${{ steps.plan.outputs.collectors }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Plan committed Native slots without project compilation
        id: plan
        env:
          NATIVE_MODE: ${{ inputs.native-diagnostic }}
          NATIVE_COMPILER_CACHE: ${{ inputs.native-compiler-cache }}
          QUALIFY: ${{ inputs.qualify }}
          QUALIFICATION_REVISION: ${{ vars.CRABBER_QUALIFY_REVISION }}
        run: |
          args=()
          if test "$QUALIFY" = true; then args+=(--qualify); fi
          python3 -I -S .github/scripts/native-ci.py plan --mode "$NATIVE_MODE" --compiler-cache "$NATIVE_COMPILER_CACHE" --source "$GITHUB_SHA" --qualification-revision "$QUALIFICATION_REVISION" "${args[@]}"

  native-worker:
    name: Native worker (${{ matrix.arch }}, ${{ matrix.slot }})
    needs: native-plan
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.native-plan.outputs.workers) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    env:
      CARGO_PROFILE_DEV_STRIP: "symbols"
      CARGO_PROFILE_TEST_STRIP: "symbols"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up Native worker with the requested compiler cache policy
        id: native-setup
        uses: ./.github/actions/check-setup
        with:
          restore-compiler-cache: ${{ matrix.compiler_cache == 'restore-compatible' && 'true' || 'false' }}
          record-cache-use: "true"
      - name: Run Native check after setup
        id: native-check
        env:
          NATIVE_SLOT: ${{ matrix.slot }}
        run: |
          started="$(date +%s.%N)"
          echo "start=$started" >> "$GITHUB_OUTPUT"
          python3 -I -S .github/scripts/check.py --part "$NATIVE_SLOT" --cache-state unclassified --budget-seconds 4800 --ci-start-time "$started" --report target/native-worker/check.json
      - name: Export finalized Native evidence
        env:
          NATIVE_SLOT: ${{ matrix.slot }}
          NATIVE_ARCH: ${{ matrix.arch }}
          NATIVE_COMPILER_CACHE: ${{ matrix.compiler_cache }}
          CACHE_USE_RECEIPT: ${{ steps.native-setup.outputs.cache-use-receipt }}
          SETUP_STARTED: ${{ steps.native-setup.outputs.setup-start }}
          CHECK_STARTED: ${{ steps.native-check.outputs.start }}
        run: |
          setup_seconds="$(python3 -I -S -c 'import os; print(float(os.environ["CHECK_STARTED"]) - float(os.environ["SETUP_STARTED"]))')"
          python3 -I -S .github/scripts/native-ci.py worker --slot "$NATIVE_SLOT" --arch "$NATIVE_ARCH" --compiler-cache "$NATIVE_COMPILER_CACHE" --cache-use-receipt "$CACHE_USE_RECEIPT" --report target/native-worker/check.json --setup-seconds "$setup_seconds" --output target/native-export
      - name: Publish Native bundle before optional maintenance
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-worker-${{ github.sha }}-${{ matrix.arch }}-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.slot }}
          path: target/native-export/
          if-no-files-found: error
          retention-days: 7

  native-collect:
    name: Native collect (${{ matrix.arch }})
    needs: [native-plan, native-worker]
    permissions:
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.native-plan.outputs.collectors) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    env:
      CARGO_PROFILE_DEV_STRIP: "symbols"
      CARGO_PROFILE_TEST_STRIP: "symbols"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up collector tools without compiler cache restoration
        uses: ./.github/actions/check-setup
        with:
          tools: collector
          restore-compiler-cache: "false"
      - name: Authenticate archives and reduce eight Native bundles
        env:
          GH_TOKEN: ${{ github.token }}
          NATIVE_ARCH: ${{ matrix.arch }}
          NATIVE_COMPILER_CACHE: ${{ matrix.compiler_cache }}
        run: python3 -I -S .github/scripts/native-ci.py collect --arch "$NATIVE_ARCH" --compiler-cache "$NATIVE_COMPILER_CACHE" --output target/native-collection
      - name: Publish provisional Native collection
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-collection-${{ github.sha }}-${{ matrix.arch }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: target/native-collection/
          if-no-files-found: error
          retention-days: 7
      - name: Describe Native assurance and terminal receipt
        run: |
          echo 'Native-only coverage validated. Cache state unclassified. Complete suite qualified false. Full check executed false.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Collection timing is provisional. Fetch the read-only receipt after this job completes for the authenticated outer span.' >> "$GITHUB_STEP_SUMMARY"
          echo 'The flat worker matrix can wait for both architectures. That delay remains in the final span.' >> "$GITHUB_STEP_SUMMARY"
