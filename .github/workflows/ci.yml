name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install ripgrep for standard tools
        run: |
          sudo apt-get update && sudo apt-get install -y ripgrep
          major=$(rg --version | head -1 | cut -d' ' -f2 | cut -d. -f1)
          test "$major" -ge 14
      - name: Install stable Rust with rustfmt and Clippy
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy
          rustup default stable
      - name: Install WASM tooling
        run: |
          rustup target add wasm32-wasip2
          cargo install wasm-tools --locked
      - name: Check workspace
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/target
          CARGO_INCREMENTAL: "0"
          CARGO_PROFILE_DEV_DEBUG: "0"
          CARGO_PROFILE_TEST_DEBUG: "0"
        run: cargo xtask check

  postgres:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    services:
      postgres:
        image: postgres:14
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      CRABBER_TEST_POSTGRES_URL: postgres://postgres@localhost:5432/postgres
      CRABBER_REQUIRE_POSTGRES: "1"
      CRABBER_POSTGRES_URL: postgres://postgres@localhost:5432/postgres
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    steps:
      - uses: actions/checkout@v4
      - name: Install stable Rust
        run: rustup toolchain install stable --profile minimal && rustup default stable
      - name: PostgreSQL contracts, concurrency, migration and process durability
        run: cargo test -p crabber-session --features postgres
      - name: Typed middleware durable resume and plan-seal reconstruction
        env:
          CRABBER_REQUIRE_POSTGRES: "1"
        run: cargo test -p crabber-runtime --features postgres
      - name: Public result-transform interruption and protected durable settlement
        run: cargo test -p crabber --features postgres --test result_transform_interrupt -- --nocapture
      - name: Public facade response-loss and fresh-process reconciliation
        run: cargo test -p crabber --features postgres --test admission_receipts -- --nocapture
      - name: Noninteractive PostgreSQL admission demo
        run: cargo run --quiet -p admission-receipt --features postgres -- --postgres
      - name: Public bounded snapshot journey and fresh-process continuation
        run: cargo test -p crabber --features postgres --test bounded_snapshots -- --nocapture
      - name: Noninteractive PostgreSQL bounded snapshot demo
        run: cargo run --quiet -p bounded-snapshot --features postgres -- --postgres

      - name: Required real Datadog payload and fresh-process recovery contracts
        run: cargo test -p crabber --features datadog,postgres --test trace_context -- --nocapture
      - name: Noninteractive PostgreSQL host tracing and export capture
        run: cargo run --quiet -p host-trace --features postgres -- postgres
      - name: Public fenced abandonment atomic rollback and process crash
        run: cargo test -p crabber --features postgres --test fenced_abandon -- --nocapture
      - name: Noninteractive PostgreSQL fenced abandonment demo
        run: cargo run --quiet -p fenced-abandon --features postgres -- --postgres
      - name: Deeply nested unknown-tool record stays decodable
        run: cargo test -p crabber --features postgres --test unknown_tool_depth -- --nocapture
      - name: Storable records remain readable
        run: cargo test -p crabber --features postgres --test storable_records -- --nocapture
      - name: Public workspace context probe and fresh-process resume
        run: cargo test -p workspace-context-probe --features postgres -- --nocapture

      - name: Public configured host and scoped execution ownership
        run: cargo test -p crabber --features postgres --test server_host -- --nocapture
      - name: Public durable interactions and frozen continuation recovery
        run: cargo test -p crabber --features postgres --test durable_interactions -- --nocapture
      - name: Public session management, imported history and quiet deletion
        run: cargo test -p crabber --features postgres --test session_management -- --nocapture
      - name: Public typed tool output persistence and next-provider request
        run: cargo test -p crabber --features postgres --test typed_output -- --nocapture
      - name: Public future queue claim, preparation and process recovery
        run: cargo test -p crabber --features postgres --test future_queue -- --nocapture
      - name: Public session defaults and cold selection binding
        run: cargo test -p crabber --features postgres --test session_defaults -- --nocapture
      - name: Public exact-run cancellation and ordered steer controls
        run: cargo test -p crabber --features postgres --test durable_controls -- --nocapture
      - name: Public original admission replay without replacement factories
        run: cargo test -p crabber --features postgres --test admission_replay -- --nocapture
      - name: Public pre-session ownership and independent session resources
        run: cargo test -p crabber --features postgres --test session_owners -- --nocapture
      - name: Offline customized server host and injected Store adoption
        run: cargo test -p server-host-probe --features postgres -- --nocapture

      - name: Public workspace roles and cross-workspace denial
        # Global host recovery must not consume paused runs left by earlier journeys.
        run: |
          psql "$CRABBER_TEST_POSTGRES_URL" -v ON_ERROR_STOP=1 -c 'CREATE DATABASE crabber_workspace_roles'
          CRABBER_TEST_POSTGRES_URL="${CRABBER_TEST_POSTGRES_URL%/*}/crabber_workspace_roles" \
            cargo test -p crabber --features postgres --test workspace_roles -- --nocapture
      - name: Provision CI worker role
        run: psql "$CRABBER_TEST_POSTGRES_URL" -v ON_ERROR_STOP=1 -f .github/scripts/provision-ci-worker.sql
      - name: Worker-role journeys
        env:
          CRABBER_TEST_POSTGRES_URL: postgres://crabber_ci_worker:crabber-ci-only@localhost:5432/postgres
          CRABBER_REQUIRE_POSTGRES: "1"
        run: cargo test -p crabber --features postgres --test future_queue --test session_owners --test durable_controls --test bounded_snapshots --test session_management --test durable_interactions --test server_host -- --nocapture

  aarch64-gnu:
    runs-on: ubuntu-24.04-arm
    env:
      BACKGROUND_JOBS_REQUIRE_SHELL: "1"
      PYTHON_REPL_REQUIRE_PYTHON: "1"
      CRABBER_TOOLS_REQUIRE_LOGIN_PROFILE: "1"
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install ripgrep for standard tools
        run: |
          sudo apt-get update && sudo apt-get install -y ripgrep
          major=$(rg --version | head -1 | cut -d' ' -f2 | cut -d. -f1)
          test "$major" -ge 14
      - name: Install stable Rust with rustfmt and Clippy
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy
          rustup default stable
      - name: Install WASM tooling
        run: |
          rustup target add wasm32-wasip2
          cargo install wasm-tools --locked
      - name: Verify native arm64 GNU toolchain
        run: |
          rustc -vV | grep 'host: aarch64-unknown-linux-gnu'
      - name: Build architecture-independent WASM fixtures
        run: cargo xtask build-fixtures
      - name: Build workspace and all targets
        run: cargo build --workspace --all-targets
      - name: Test workspace
        run: cargo test --workspace
      - name: Run credential-free embedding smoke test
        run: cargo run --quiet -p minimal-embed
      - name: Run standard tools mounting smoke test
        run: cargo run --quiet -p mount-standard -- --check

  aarch64-musl:
    runs-on: ubuntu-24.04-arm
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      CC_aarch64_unknown_linux_musl: musl-gcc
      CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
    steps:
      - uses: actions/checkout@v4
      - name: Install stable Rust and musl target
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add aarch64-unknown-linux-musl
      - name: Install native musl toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools ripgrep
          major=$(rg --version | head -1 | cut -d' ' -f2 | cut -d. -f1)
          test "$major" -ge 14
      - name: Build musl workspace without native TLS example
        run: cargo build --workspace --exclude agui-sse --target aarch64-unknown-linux-musl
      - name: Test standard tools as native arm64 musl binaries
        shell: bash
        run: |
          cargo test -p crabber-tools-catalog -p crabber-tools-fileops -p crabber-tools-glob -p crabber-tools-search --target aarch64-unknown-linux-musl 2>&1 | tee musl-tests.log
          grep -E '^test result: ok\. [1-9][0-9]* passed' musl-tests.log
      - name: Run static standard tools mounting smoke test
        run: cargo run -p mount-standard --target aarch64-unknown-linux-musl -- --check
      - name: Verify static linking of embedding and tools binaries
        shell: bash
        run: |
          for binary in minimal-embed mount-standard; do
            file "target/aarch64-unknown-linux-musl/debug/$binary" | grep -E 'statically linked|static-pie linked'
          done

  extensions-python-311:
    runs-on: ubuntu-latest
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      PYTHON_REPL_REQUIRE_PYTHON: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Install stable Rust
        run: rustup toolchain install stable --profile minimal && rustup default stable
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Test native Python REPL with the oldest supported Python
        run: cargo test -p crabber-extensions --test python_repl

  consumer-probe:
    if: github.event_name == 'push'
    needs: check
    runs-on: ubuntu-latest
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      CARGO_TARGET_DIR: ${{ github.workspace }}/target/consumer
    steps:
      - uses: actions/checkout@v4
      - name: Install stable Rust
        run: rustup toolchain install stable --profile minimal && rustup default stable
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install ripgrep
        run: |
          sudo apt-get update && sudo apt-get install -y ripgrep
          major=$(rg --version | head -1 | cut -d' ' -f2 | cut -d. -f1)
          test "$major" -ge 14
      - name: Fetch the public Crabber source over HTTPS
        run: git config --global url.https://github.com/mattsp1290/crabber.git.insteadOf ssh://git@github.com/mattsp1290/crabber.git
      - name: Qualify the runtime, tools, and native extensions at one revision
        env:
          CRABBER_REV: ${{ github.sha }}
        run: ./testdata/standard-tools-consumer/check.sh
      - name: Qualify native extension host and restart journeys
        env:
          CRABBER_REV: ${{ github.sha }}
        run: ./testdata/extensions-consumer/run.sh
