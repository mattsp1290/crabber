name: Check setup
description: Restore the canonical check environment and compiler cache
inputs:
  restore-compiler-cache:
    description: Restore and refresh the canonical compiler cache
    default: "true"
  tools:
    description: Required tool set, check or collector
    default: check
  record-cache-use:
    description: Write a source-bound setup cache-use receipt
    default: "false"
outputs:
  setup-start:
    description: Setup clock start before cache restoration
    value: ${{ steps.setup.outputs.start }}
  cache-state:
    description: Restored cache classification
    value: ${{ steps.conditions.outputs.state }}
  cache-outcome:
    description: Cache restore step outcome for post-check maintenance
    value: ${{ steps.cache.outcome }}
  cache-primary-key:
    description: Cache key used by the canonical main-only writer
    value: ${{ steps.cache.outputs.cache-primary-key }}
  cache-use-receipt:
    description: Finalized optional setup cache-use receipt
    value: ${{ steps.cache-use.outputs.path }}
runs:
  using: composite
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: "3.14"
    - name: Install ripgrep for standard tools
      if: inputs.tools == 'check'
      shell: bash
      run: |
        ripgrep_ready() {
          local version
          version="$(rg --version 2>/dev/null)" || return 1
          [[ "$version" =~ ^ripgrep[[:blank:]]+([0-9]+)\.[0-9]+\.[0-9]+([[:space:]]|$) ]] &&
            test "${BASH_REMATCH[1]}" -ge 14
        }
        if ! ripgrep_ready; then
          sudo timeout --kill-after=10s 5m bash -e -o pipefail -c '
            apt=(apt-get -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 -o Acquire::Retries=2)
            "${apt[@]}" update
            "${apt[@]}" install -y ripgrep
          '
        fi
        ripgrep_ready
    - name: Provision pinned Rust
      shell: bash
      run: |
        rust_version="$(python3 -I -S -c 'import json; print(json.load(open(".config/test-tools.json"))["rust"]["version"])')"
        rustup toolchain install "$rust_version" --profile minimal --component rustfmt --component clippy
        if test "${{ inputs.tools }}" = check; then
          rustup target add --toolchain "$rust_version" wasm32-wasip2
        fi
    - name: Record compiler cache identity
      id: compiler
      env:
        GRAPH_HASH: ${{ hashFiles('Cargo.toml', 'xtask/Cargo.toml', 'Cargo.lock', 'fixtures/wasm/Cargo.lock', 'fixtures/wasm-negative/Cargo.lock', 'testdata/*/Cargo.lock', 'rust-toolchain.toml', '.config/test-tools.json', '.config/nextest.toml', 'xtask/src/complete.rs', 'xtask/src/postgres/container.rs') }}
        RECORD_CACHE_USE: ${{ inputs.record-cache-use }}
        RESTORE_COMPILER_CACHE: ${{ inputs.restore-compiler-cache }}
        SETUP_TOOLS: ${{ inputs.tools }}
      shell: bash
      run: |
        compiler_file=target/test-performance/cache-use/compiler.txt
        mkdir -p "$(dirname "$compiler_file")"
        rustc -Vv > "$compiler_file"
        compiler_hash="$(sha256sum "$compiler_file" | cut -d ' ' -f 1)"
        base="rust-$RUNNER_OS-$RUNNER_ARCH-$compiler_hash-dev0-test0-strip-symbols-inc0-combined-v2-"
        graph="$base$GRAPH_HASH-"
        primary="$graph$GITHUB_SHA-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
        printf '%s\n' "hash=$compiler_hash" "base-key=$base" "graph-key=$graph" "primary-key=$primary" >> "$GITHUB_OUTPUT"
        if test "$RECORD_CACHE_USE" = true; then
          test "$SETUP_TOOLS" = check
          python3 -I -S .github/scripts/cache-use.py begin --restore "$RESTORE_COMPILER_CACHE" --compiler "$compiler_file" --base-key "$base" --graph-key "$graph" --primary-key "$primary" --graph-hash "$GRAPH_HASH"
        fi
    - name: Start setup clock before cache restoration
      id: setup
      shell: bash
      run: echo "start=$(date +%s.%N)" >> "$GITHUB_OUTPUT"
    - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      id: cache
      if: inputs.restore-compiler-cache == 'true' && inputs.tools == 'check'
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target/debug
          target/release
          target/wasm32-wasip2
          target/local-probes
          target/consumer-probes
          target/test-tools
          fixtures/wasm/target
        key: ${{ steps.compiler.outputs.primary-key }}
        # Prefer the exact dependency/feature graph. The fallback keeps the
        # compiler/base profile identical; the exact key includes per-package
        # profile overrides in Cargo.toml. Cargo still validates every unit's
        # dependency/features fingerprint and rebuilds changed source.
        restore-keys: |
          ${{ steps.compiler.outputs.graph-key }}
          ${{ steps.compiler.outputs.base-key }}
    - name: Record cache conditions and install pinned tools
      if: inputs.tools == 'check'
      id: conditions
      env:
        RESTORED_KEY: ${{ steps.cache.outputs.cache-matched-key }}
        RESTORE_OUTCOME: ${{ steps.cache.outcome }}
        RECORD_CACHE_USE: ${{ inputs.record-cache-use }}
      shell: bash
      run: |
        python3 -I -S - <<'PY'
        import json, os, pathlib, subprocess, sys
        root = pathlib.Path('target/test-tools')
        root.mkdir(parents=True, exist_ok=True)
        pins = json.loads(pathlib.Path('.config/test-tools.json').read_text())
        marker = root / 'complete-cache.json'
        if os.environ['RECORD_CACHE_USE'] == 'true':
            subprocess.run([sys.executable, '-I', '-S', '.github/scripts/cache-use.py', 'capture', '--action-outcome', os.environ['RESTORE_OUTCOME'], '--matched-key', os.environ['RESTORED_KEY']], check=True)
        warm = marker.exists() and bool(os.environ['RESTORED_KEY'])
        state = 'unclassified' if warm else 'bootstrap'
        with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
            print('state=' + state, file=output)
        report = pathlib.Path('target/test-performance/cache-restore.json')
        report.parent.mkdir(parents=True, exist_ok=True)
        report.write_text(json.dumps({'restored_key': os.environ['RESTORED_KEY'], 'previous_complete_result': json.loads(marker.read_text()) if marker.exists() else None, 'cache_state': state}, indent=2) + '\n')
        marker.unlink(missing_ok=True)
        binary = root / 'cargo-nextest'
        version = subprocess.run([str(binary), 'nextest', '--version'], capture_output=True, text=True).stdout.split() if binary.exists() else []
        if len(version) < 2 or version[1] != pins['nextest']['version']:
            subprocess.run([sys.executable, '-I', '-S', '.github/scripts/install-nextest.py', str(root)], check=True)
        PY
        wasm_version="$(python3 -I -S -c 'import json; print(json.load(open(".config/test-tools.json"))["wasm-tools"]["version"])')"
        if ! test -x target/test-tools/bin/wasm-tools || test "$(target/test-tools/bin/wasm-tools --version)" != "wasm-tools $wasm_version"; then
          cargo install wasm-tools --version "$wasm_version" --locked --root target/test-tools --force
        fi
        echo "$GITHUB_WORKSPACE/target/test-tools" >> "$GITHUB_PATH"
        echo "$GITHUB_WORKSPACE/target/test-tools/bin" >> "$GITHUB_PATH"
    - name: Restore and verify pinned PostgreSQL image
      if: inputs.tools == 'check'
      shell: bash
      run: |
        if test -f target/test-tools/postgres-14.tar; then
          docker load -i target/test-tools/postgres-14.tar
        fi
        docker pull "$CRABBER_POSTGRES_IMAGE"
        if ! test -f target/test-tools/postgres-14.tar; then
          docker save "$CRABBER_POSTGRES_IMAGE" -o target/test-tools/postgres-14.tar
        fi
    - name: Refresh source provenance after cache restore
      if: inputs.restore-compiler-cache == 'true' && inputs.tools == 'check'
      shell: bash
      env:
        RECORD_CACHE_USE: ${{ inputs.record-cache-use }}
      run: |
        args=()
        if test "$RECORD_CACHE_USE" = true; then
          args+=(--report target/test-performance/cache-use/source-refresh.json)
        fi
        python3 -I -S .github/scripts/cache-source-times.py restore "${args[@]}"
        cargo clean -p minimal-embed -p fenced-abandon -p operational-telemetry
    - name: Finalize optional setup cache-use receipt
      if: inputs.record-cache-use == 'true' && inputs.tools == 'check'
      id: cache-use
      shell: bash
      run: |
        python3 -I -S .github/scripts/cache-use.py finish
        echo "path=$GITHUB_WORKSPACE/target/test-performance/cache-use/receipt.json" >> "$GITHUB_OUTPUT"
