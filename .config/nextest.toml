filter = """
package(crabber-runtime) & (
    test(=tests::owned_execution::abandoned_resume_waiter_leaves_claim_and_work_owned)
  | test(=tests::owned_execution::done_consumes_actual_join_and_host_drain_can_join_before_result_is_taken)
