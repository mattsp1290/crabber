# Installation is pinned by test-tools.json and checked by xtask.
nextest-version = { required = "0.9.138" }

[test-groups]
postgres = { max-threads = 4 }
postgres-ci = { max-threads = 4 }
postgres-one = { max-threads = 1 }
postgres-four = { max-threads = 4 }
wasm = { max-threads = 4 }
sqlite = { max-threads = 4 }

[profile.default]
test-threads = 4
retries = 0
fail-fast = false
# Outer hang bound only; original Rust contract deadlines remain unchanged.
slow-timeout = { period = "60s", terminate-after = 30 }

# Weights account for internal Tokio workers and fresh helper processes.
[[profile.default.overrides]]
filter = 'package(crabber-runtime)'
threads-required = 2

[[profile.default.overrides]]
filter = 'binary(/wasm/) | test(/wasm/)'
test-group = 'wasm'
threads-required = 2

[[profile.default.overrides]]
filter = 'test(/postgres/)'
test-group = 'postgres'

[[profile.default.overrides]]
filter = 'test(/sqlite/)'
test-group = 'sqlite'

[profile.postgres]
test-threads = 4
retries = 0
fail-fast = false

# Every discovered entrypoint in the required lane is bounded, including future
# names and helper tests that do not contain "postgres". Cargo demos run later.
[[profile.postgres.overrides]]
filter = 'all()'
test-group = 'postgres'

# Explicit comparison profiles; the measured normal profile uses four slots.
[profile.postgres-one]
test-threads = 1
retries = 0
fail-fast = false
[[profile.postgres-one.overrides]]
filter = 'all()'
test-group = 'postgres-one'

[profile.postgres-four]
test-threads = 4
retries = 0
fail-fast = false
[[profile.postgres-four.overrides]]
filter = 'all()'
test-group = 'postgres-four'

# One required run: ordinary cases do not consume a PostgreSQL slot.
[profile.complete]
test-threads = 16
retries = 0
fail-fast = false

# Runtime unit and extension fixtures own MemoryStore or local task state.
# Exact names leave future and SQL entrypoints under the conservative fallback.
# Exact source-audited Session tests use private MemoryStore/Ledger fixtures
# or no backend. SQL tracing fixtures and future unknown tests stay conservative.
# Exact audited Memory and private HTTP fixtures need no PostgreSQL reservation.
[[profile.complete.overrides]]
filter = """
(package(crabber) & binary(=server_host) & (
    test(=tool_resources::interrupted_tool_seals_scope_and_joins_cooperative_resources)
  | test(=tool_resources::resolution::closed_host_resolves_once_and_preserves_incomplete_cleanup)
  | test(=tool_resources::resource_failure_blocks_worker_success_and_remains_visible_across_drains)
  | test(=tool_resources::snapshot_drain_does_not_seal_an_active_tool_scope)
  | test(=tool_resources::incomplete_worker_retains_noncooperative_resource_join_after_timeout)
))
| (package(crabber) & binary(=session_management) & (
    test(=management::management_controls_work_without_factories_and_after_close)
))
| (package(crabber) & binary(=trace_context) & (
    test(=legacy_observers_and_multiple_host_observers_receive_each_callback_once)
  | test(=malformed_transport_context_is_rejected_before_admission)
  | test(=predecessor_is_validated_bounded_and_requires_a_new_numeric_trace)
  | test(=replay_ignores_replacement_context_without_receipt_or_execution_mutation)
))
| (package(crabber) & binary(=typed_output) & (
    test(=http::public_responses_loop_sends_protected_mixed_tool_output)
  | test(=public_mixed_output_remains_typed_and_error_escalation_is_monotonic)
))
| (package(workspace-context-probe) & binary(=memory) & (
    test(=cancellation_is_available_to_a_running_tool)
  | test(=drifted_identity_is_rejected_and_the_tool_is_not_invoked)
  | test(=empty_identity_is_unavailable_not_a_host_default_or_model_argument)
  | test(=one_empty_field_is_unavailable_while_the_other_is_exposed)
  | test(=permission_denial_never_invokes_the_executor)
  | test(=replacement_fence_never_authorizes_pending_approval)
  | test(=two_sessions_observe_their_own_workspace_across_runs)
))
| (package(crabber) & binary(=result_transform_interrupt) & (
    test(=close_timeout_retains_child_reaper_and_terminal_registry)
))
"""
