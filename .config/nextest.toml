# Installation is pinned by test-tools.json and checked by xtask.
nextest-version = { required = "0.9.138" }

[test-groups]
postgres = { max-threads = 4 }
postgres-ci = { max-threads = 2 }
postgres-one = { max-threads = 1 }
postgres-four = { max-threads = 4 }
wasm = { max-threads = 4 }
sqlite = { max-threads = 4 }

[profile.default]
test-threads = 4
retries = 0
fail-fast = false
# Outer hang bound only; original Rust contract deadlines remain unchanged.
slow-timeout = { period = "60s", terminate-after = 30 }

# Weights account for internal Tokio workers and fresh helper processes.
[[profile.default.overrides]]
filter = 'package(crabber-runtime)'
threads-required = 2

[[profile.default.overrides]]
filter = 'binary(/wasm/) | test(/wasm/)'
test-group = 'wasm'
threads-required = 2

[[profile.default.overrides]]
filter = 'test(/postgres/)'
test-group = 'postgres'

[[profile.default.overrides]]
filter = 'test(/sqlite/)'
test-group = 'sqlite'

[profile.postgres]
test-threads = 4
retries = 0
fail-fast = false

# Every discovered entrypoint in the required lane is bounded, including future
# names and helper tests that do not contain "postgres". Cargo demos run later.
[[profile.postgres.overrides]]
filter = 'all()'
test-group = 'postgres'

# Explicit comparison profiles; the measured normal profile uses four slots.
[profile.postgres-one]
test-threads = 1
retries = 0
fail-fast = false
[[profile.postgres-one.overrides]]
filter = 'all()'
test-group = 'postgres-one'

[profile.postgres-four]
test-threads = 4
retries = 0
fail-fast = false
[[profile.postgres-four.overrides]]
filter = 'all()'
test-group = 'postgres-four'

# One required run: ordinary cases do not consume a PostgreSQL slot.
[profile.complete]
test-threads = 16
retries = 0
fail-fast = false

# These exact consumer fixtures construct only fresh MemoryStore values.
# They use ordinary worker slots, including their isolated literal child.
[[profile.complete.overrides]]
filter = 'package(crabber-session) & (test(=session_owner::owned_scope::task::pending::enrolled_initial::consumer::tests::caller_timeout_and_drop_keep_the_same_supervisor_resource_join_and_capacity) | test(=session_owner::owned_scope::task::pending::enrolled_initial::consumer::tests::every_native_call_remains_in_the_same_original_task) | test(=session_owner::owned_scope::task::pending::enrolled_initial::consumer::tests::literal_child) | test(=session_owner::owned_scope::task::pending::enrolled_initial::consumer::tests::literal_consumer_poll_and_drop_children_are_contained) | test(=session_owner::owned_scope::task::pending::enrolled_initial::consumer::tests::native_deadline_after_successful_literal_drop_can_reconcile_paired_close) | test(=session_owner::owned_scope::task::pending::enrolled_initial::consumer::tests::retirement::committed_seal_lost_ack_replays_same_original_and_retains_outputs) | test(=session_owner::owned_scope::task::pending::enrolled_initial::consumer::tests::retirement_witness_keeps_actual_disposition_and_pre_io_activation))'
test-group = '@global'

# Both killed-worker journeys contain an unchanged real lease-expiry wait.
# The unprefixed trace case uses PostgreSQL and keeps its backend group.
[[profile.complete.overrides]]
filter = 'package(crabber) & binary(=trace_context) & (test(=durable_process::killed_started_worker_refuses_replay_and_preserves_closed_anchor) | test(=durable_process::sqlite_killed_started_worker_refuses_replay_and_preserves_closed_anchor))'
priority = 30

# Start long independent native histories before shorter cases in their group.
# Priority alone changes; backend slots, worker weights and deadlines remain.
[[profile.complete.overrides]]
filter = 'package(crabber-session) & (test(=memory::queue::tests::queue_bounds) | test(=sqlite::queue::tests::queue_bounds) | test(=postgres::queue::tests::queue_bounds) | test(=sqlite::session_owner::tests::session_owner_contract) | test(=postgres::session_owner::tests::session_owner_contract) | test(=memory::session_owner::tests::session_owner_shared_capacity) | test(=postgres::session_owner::drivers::tests::approval_successor_driver_contract))'
priority = 30

# These MemoryStore-only blocked-drop histories include real native deadlines.
# Start them early while retaining the conservative service group and weight.
[[profile.complete.overrides]]
filter = 'package(crabber-session) & (test(=session_owner::owned_scope::task::pending::enrolled_initial::tests::every_native_deadline_keeps_actual_blocked_drop_visible_and_retained) | test(=session_owner::owned_scope::task::pending::enrolled_initial::tests::every_ready_native_reply_stays_private_through_actual_blocked_drop))'
priority = 20

# Service limits take priority even inside a WASM binary. The later WASM
# override independently retains its two general scheduler reservations.
# These reconnect journeys compile/register echo WASM but dispatch a native tool.
# Weight one keeps SQL groups uniform while heavy WASM cases retain weight two.
[[profile.complete.overrides]]
filter = 'package(crabber) & binary(=wasm_roles) & (test(=freshly_connected_postgres_agent_resumes_native_and_wasm_plan) | test(=freshly_connected_sqlite_agent_resumes_native_and_wasm_plan))'
threads-required = 1

[[profile.complete.overrides]]
filter = 'test(/postgres/)'
test-group = 'postgres'
priority = 10

[[profile.complete.overrides]]
filter = 'test(/sqlite/)'
test-group = 'sqlite'

[[profile.complete.overrides]]
filter = 'binary(/wasm/) | test(/wasm/)'
test-group = 'wasm'
threads-required = 2

[[profile.complete.overrides]]
filter = 'test(/(^sqlite::|::sqlite_|^sqlite_)/)'
test-group = 'sqlite'

[[profile.complete.overrides]]
filter = 'test(/(^memory::|::memory_|^memory_)/)'
threads-required = 1

[[profile.complete.overrides]]
filter = 'not test(/(^memory::|::memory_|^memory_|^sqlite::|::sqlite_|^sqlite_)/) & (package(crabber-session) | package(crabber-runtime) | package(crabber) | package(server-host-probe) | package(workspace-context-probe) | package(crabber-test-support))'
test-group = 'postgres'

# Override the old partial profile's generic runtime weight; only actual heavy
# WASM cases above reserve two scheduler threads in the combined run.
[[profile.complete.overrides]]
filter = 'all()'
threads-required = 1

# One required run: ordinary cases do not consume a PostgreSQL slot.
[profile.complete-ci]
test-threads = 4
retries = 0
fail-fast = false

