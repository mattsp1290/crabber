[package]
name = "host-trace"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
crabber = { path = "../../crates/crabber", features = ["datadog"] }
async-trait = "0.1"
serde_json = "1"
flate2 = "1"
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "process"] }

[lints]
workspace = true

[features]
default = ["datadog"]
datadog = ["crabber/datadog"]
postgres = ["crabber/postgres"]
