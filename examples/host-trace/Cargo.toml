[package]
name = "host-trace"
version.workspace = true
edition.workspace = true
license.workspace = true

# Normal builds retain this executable; required CLI checks stay enabled.
# Keep unit tests in library or integration targets.
[[bin]]
name = "host-trace"
path = "src/main.rs"
test = false

[dependencies]
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["registry", "fmt", "json", "env-filter"] }
crabber = { path = "../../crates/crabber", features = ["datadog"] }
async-trait = "0.1"
serde_json = "1"
flate2 = "1"
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "process"] }

[dependencies.sqlx]
version = "0.8"
default-features = false
features = ["runtime-tokio", "postgres", "tls-rustls"]
optional = true

[lints]
workspace = true

[features]
default = ["datadog"]
datadog = ["crabber/datadog"]
postgres = ["crabber/postgres", "dep:sqlx"]
sqlite = ["crabber/sqlite"]
