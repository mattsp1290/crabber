[package]
name = "fenced-abandon"
version.workspace = true
edition.workspace = true
license.workspace = true
build = "build.rs"

# Normal builds retain this executable; required CLI checks stay enabled.
# Keep unit tests in library or integration targets.
[[bin]]
name = "fenced-abandon"
path = "src/main.rs"
test = false

[dependencies]
tempfile = { version = "3", optional = true }
crabber = { path = "../../crates/crabber" }
tokio = { version = "1", features = ["macros", "rt", "process", "time"] }
async-trait = "0.1"
serde_json = "1"

[dependencies.sqlx]
version = "0.8"
default-features = false
features = ["runtime-tokio", "postgres", "tls-rustls"]
optional = true

[lints]
workspace = true

[features]
default = []
postgres = ["crabber/postgres", "dep:sqlx"]
sqlite = ["crabber/sqlite", "dep:tempfile"]
