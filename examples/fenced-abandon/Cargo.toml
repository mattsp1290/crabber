[package]
name = "fenced-abandon"
version.workspace = true
edition.workspace = true
license.workspace = true
build = "build.rs"

[dependencies]
tempfile = { version = "3", optional = true }
crabber = { path = "../../crates/crabber" }
tokio = { version = "1", features = ["macros", "rt", "process", "time"] }
async-trait = "0.1"
serde_json = "1"

[lints]
workspace = true

[features]
default = []
postgres = ["crabber/postgres"]
sqlite = ["crabber/sqlite", "dep:tempfile"]
