[package]
name = "native-extension"
version.workspace = true
edition.workspace = true
license.workspace = true

# Normal builds retain this executable; required CLI checks stay enabled.
# Keep unit tests in library or integration targets.
[[bin]]
name = "native-extension"
path = "src/main.rs"
test = false

[dependencies]
async-trait = "0.1"
crabber = { path = "../../crates/crabber" }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true
