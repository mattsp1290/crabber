[package]
name = "workspace-context-probe"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
async-trait = "0.1"
crabber = { path = "../../crates/crabber" }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "sync", "process"] }

[lints]
workspace = true

[features]
default = []
postgres = ["crabber-test-support/postgres", "crabber/postgres"]
sqlite = ["crabber/sqlite"]

[dev-dependencies]
crabber-test-support = { path = "../../crates/crabber-test-support", default-features = false }
tempfile = "3"
time = "0.3"
