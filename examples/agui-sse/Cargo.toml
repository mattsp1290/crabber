[package]
name = "agui-sse"
version.workspace = true
edition.workspace = true
license.workspace = true

# Normal builds retain this executable; required CLI checks stay enabled.
# Keep unit tests in library or integration targets.
[[bin]]
name = "agui-sse"
path = "src/main.rs"
test = false

[dependencies]
crabber = { path = "../../crates/crabber" }
axum = "0.8.9"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "time"] }
tokio-util = { version = "0.7", features = ["rt"] }
futures = "0.3"
serde_json = "1"
async-trait = "0.1"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream"] }
crabber-agui = { path = "../../crates/crabber-agui" }
ag-ui-client = { git = "https://github.com/mattsp1290/ag-ui.git", rev = "705303b26b6b900cdf9bdfa456fbd92a7003ca6b" }

[dev-dependencies]
tokio = { version = "1", features = ["test-util"] }

[lints]
workspace = true
