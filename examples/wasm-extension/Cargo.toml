[package]
name = "wasm-extension"
version.workspace = true
edition.workspace = true
license.workspace = true

# Normal builds retain this executable; required CLI checks stay enabled.
# Keep unit tests in library or integration targets.
[[bin]]
name = "wasm-extension"
path = "src/main.rs"
test = false

[dependencies]
crabber = { path = "../../crates/crabber", features = ["wasm"] }
sha2 = "0.10"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true
