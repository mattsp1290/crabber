[package]
name = "bounded-snapshot"
version.workspace = true
edition.workspace = true
license.workspace = true

# Normal builds retain this executable; required CLI checks stay enabled.
# Keep unit tests in library or integration targets.
[[bin]]
name = "bounded-snapshot"
path = "src/main.rs"
test = false

[dependencies]
tempfile = { version = "3", optional = true }
crabber = { path = "../../crates/crabber" }
allocation-counter = "0.8.1"
serde_json = "1"
time = "0.3"
tokio = { version = "1", features = ["macros", "rt", "sync"] }

[features]
default = []
postgres = ["crabber/postgres", "dep:sqlx"]
sqlite = ["crabber/sqlite", "dep:tempfile"]

[dependencies.sqlx]
version = "0.8"
default-features = false
features = ["runtime-tokio", "postgres", "tls-rustls"]
optional = true

[lints]
workspace = true
