[package]
name = "server-host-probe"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

# Normal builds retain this executable; required CLI checks stay enabled.
# Keep unit tests in library or integration targets.
[[bin]]
name = "server-host-probe"
path = "src/main.rs"
test = false

[dependencies]
async-trait = "0.1"
crabber = { path = "../../crates/crabber", features = ["openai", "anthropic"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "sync"] }
tempfile = "3"
time = "0.3"

[dev-dependencies]
crabber-test-support = { path = "../../crates/crabber-test-support", default-features = false }
sha2 = "0.10"

[features]
default = []
wasm = ["crabber/wasm"]
postgres = ["crabber-test-support/postgres", "crabber/postgres"]
sqlite = ["crabber/sqlite"]

[lints]
workspace = true
