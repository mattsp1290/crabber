[package]
name = "server-host-probe"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
async-trait = "0.1"
crabber = { path = "../../crates/crabber" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "sync"] }
tempfile = "3"

[dev-dependencies]
time = "0.3"

[features]
default = []
postgres = ["crabber/postgres"]
sqlite = ["crabber/sqlite"]

[lints]
workspace = true
