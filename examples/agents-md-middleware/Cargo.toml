[package]
name = "agents-md-middleware"
version.workspace = true
edition.workspace = true
license.workspace = true

# Normal builds retain this executable; required CLI checks stay enabled.
# Keep unit tests in library or integration targets.
[[bin]]
name = "agents-md-middleware"
path = "src/main.rs"
test = false

[dependencies]
crabber = { path = "../../crates/crabber" }
crabber-middleware = { path = "../../crates/crabber-middleware" }
async-trait = "0.1"
tokio = { version = "1", features = ["macros", "rt"] }

[lints]
workspace = true
