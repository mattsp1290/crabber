[package]
name = "operational-telemetry"
version.workspace = true
edition.workspace = true
license.workspace = true

# Normal builds retain this executable; required CLI checks stay enabled.
# Keep unit tests in library or integration targets.
[[bin]]
name = "operational-telemetry"
path = "src/main.rs"
test = false

[dependencies]
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["registry", "fmt", "json", "env-filter"] }
crabber = { path = "../../crates/crabber", features = ["otlp"] }
async-trait = "0.1"
serde_json = "1"
flate2 = "1"
futures = "0.3"
time = "0.3"
tokio = { version = "1", features = ["macros", "rt", "net", "io-util", "time", "test-util"] }

opentelemetry-proto = { version = "0.33", default-features = false, features = ["gen-tonic-messages", "trace"] }
prost = "0.14"

[lints]
workspace = true
